<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>__TITLE__</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  #stage { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!-- 正文在构建时就写进了下面这个 srcdoc 属性，运行时不再请求任何数据 -->
<iframe id="stage" referrerpolicy="no-referrer"
  sandbox="allow-scripts allow-modals allow-popups allow-forms" srcdoc="__SRCDOC__"></iframe>
</body>
</html>
