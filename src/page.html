<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>加载中…</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  #stage { display: block; width: 100%; height: 100%; border: 0; }
  #status { display: flex; align-items: center; justify-content: center; gap: 6px; height: 100%; padding: 24px;
    box-sizing: border-box; text-align: center; color: #57606a;
    font: 14px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  #status[hidden] { display: none; }
  #status a { color: #0969da; }
</style>
</head>
<body>
<div id="status">正在读取 issue…</div>
<iframe id="stage" hidden referrerpolicy="no-referrer"
  sandbox="allow-scripts allow-modals allow-popups allow-forms"></iframe>
<script>
(function () {
  var statusEl = document.getElementById('status');
  var stageEl = document.getElementById('stage');

  /* 标签名和注释起始序列都只能拼出来，不能整段写进本文件：HTML 解析器看到脚本结束标签的字面量
     会就地收尾，看到注释起始序列会切到转义态、进而让本段脚本的结束标签失效。 */
  var TAG = 'scr' + 'ipt';
  var OPEN_TAG = '<' + TAG + '>';
  var CLOSE_TAG = '<' + '/' + TAG + '>';
  var COMMENT_OPEN = '<' + '!--';

  // 追加到片段末尾：出错的片段至少给个可见的报错，而不是白屏
  var REPORT = '<style>' +
      '#__bin_report__{position:fixed;left:0;right:0;bottom:0;max-height:45vh;overflow:auto;margin:0;padding:10px 14px;' +
      'background:#fff5f5;color:#cf222e;border-top:1px solid #ffcecb;white-space:pre-wrap;word-break:break-word;' +
      'font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;z-index:2147483647}' +
      '</style>' +
      OPEN_TAG + '(function(){' +
      'function report(label,message,stack){' +
      'var box=document.getElementById("__bin_report__");' +
      'if(!box){box=document.createElement("pre");box.id="__bin_report__";document.body.appendChild(box);}' +
      'box.textContent+=label+": "+message+(stack?"\\n"+stack:"")+"\\n";}' +
      'window.__binReport=report;' +
      'window.addEventListener("error",function(e){report("Error",e.message,e.error&&e.error.stack);});' +
      'window.addEventListener("unhandledrejection",function(e){var r=e.reason;' +
      'report("UnhandledRejection",(r&&r.message)||String(r),r&&r.stack);});' +
      '})();' + CLOSE_TAG;

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
    });
  }

  // 正文若是 JS，包进 script 标签前要拆掉可能提前闭合标签的序列
  function escapeScript(code) {
    return String(code)
      .replace(new RegExp('<' + '/' + TAG, 'gi'), '<\\/script')
      .replace(new RegExp(COMMENT_OPEN, 'g'), '<\\!--');
  }

  function buildDocument(issue) {
    var source = String(issue.body || '');
    var head = '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">\n' +
      '<title>' + escapeHtml(issue.title) + '</title>\n</head>\n<body>\n';

    if (issue.mode === 'js') {
      return head + OPEN_TAG + escapeScript(source) + CLOSE_TAG + '\n' + REPORT + '\n</body>\n</html>';
    }
    // 本身就是完整文档（带 doctype / <html>）时原样使用，否则补一个带 charset 的外壳
    if (/^\s*(?:<!doctype\s|<html[\s>])/i.test(source)) return source + '\n' + REPORT;
    return head + source + '\n' + REPORT + '\n</body>\n</html>';
  }

  function showStatus(nodes) {
    statusEl.hidden = false;
    statusEl.replaceChildren.apply(statusEl, nodes);
  }

  stageEl.addEventListener('load', function () {
    statusEl.hidden = true;
    stageEl.hidden = false;
  }, { once: true });

  fetch('./issue.json', { cache: 'no-store' })
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function (issue) {
      document.title = '#' + issue.number + ' ' + issue.title;
      if (!String(issue.body || '').trim()) {
        var hint = document.createElement('span');
        hint.textContent = '这个 issue 的正文是空的，';
        var link = document.createElement('a');
        link.href = issue.htmlUrl;
        link.textContent = '去 GitHub 编辑';
        link.rel = 'noreferrer';
        showStatus([hint, link]);
        return;
      }
      stageEl.srcdoc = buildDocument(issue);
    })
    .catch(function (error) {
      showStatus([document.createTextNode('读取 issue.json 失败：' + error.message)]);
    });
})();
</script>
</body>
</html>
