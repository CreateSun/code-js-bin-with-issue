.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}
`;

const P = {"origin":[350,558.7263047176749],"scale":1.2196336053955261,"azimuth":40,"elevation":30};
const PLATE_TOP = 97, LAYERS = 26, LAYER_H = 4.4, BED_Y0 = 67;
const BEAM_Y = 56, GANTRY_REST = 139, TOOL_TOP = 96 + 34;
const printR = (t) => 26 + t * 12;
const polyPath = (pts) => pts.map(([x, y], i) => (i ? "L" : "M") + (Math.round(x * 10) / 10) + " " + (Math.round(y * 10) / 10)).join("");
const smooth3 = (pts, per) => {
  per = per || 9;
  const pick = (i) => pts[Math.max(0, Math.min(pts.length - 1, i))];
  const out = [pts[0]];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pick(i - 1), p1 = pick(i), p2 = pick(i + 1), p3 = pick(i + 2);
    for (let s = 1; s <= per; s++) {
      const t = s / per, t2 = t * t, t3 = t2 * t;
      const c = (a, b, cc, d) => 0.5 * (2 * b + (-a + cc) * t + (2 * a - 5 * b + 4 * cc - d) * t2 + (-a + 3 * b - 3 * cc + d) * t3);
      out.push([c(p0[0], p1[0], p2[0], p3[0]), c(p0[1], p1[1], p2[1], p3[1]), c(p0[2], p1[2], p2[2], p3[2])]);
    }
  }
  return out;
};
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const readout = document.querySelector("[data-readout]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const PRINT = [...svg.querySelectorAll('[data-part="print"]')];
const bedG = svg.querySelector('[data-part="bed"]');
const gantryG = svg.querySelector('[data-part="gantry"]');
const toolG = svg.querySelector('[data-part="tool"]');
const tubeGroup = svg.querySelector('[data-part="tube"]');
const tubePaths = [...tubeGroup.querySelectorAll('[data-part="tube-fill"] path')];
const tubeHi = svg.querySelector('[data-part="tube-hi"]');
const TUBE_HALF = 3.394;
const ribbonD = (points) => {
  const left = [], right = [];
  for (let i = 0; i < points.length; i++) {
    const prev = points[Math.max(0, i - 1)];
    const next = points[Math.min(points.length - 1, i + 1)];
    const dx = next[0] - prev[0], dy = next[1] - prev[1];
    const len = Math.sqrt(dx * dx + dy * dy) || 1;
    const nx = -dy / len, ny = dx / len;
    left.push([points[i][0] + nx * TUBE_HALF, points[i][1] + ny * TUBE_HALF]);
    right.push([points[i][0] - nx * TUBE_HALF, points[i][1] - ny * TUBE_HALF]);
  }
  return polyPath(left.concat(right.reverse())) + "Z";
};

let layer = 10, theta = 2.303834612632515, x = -20.609222675852834, dy = -22.888860624703742;
let paused = false, explode = 0, apart = 0, hover = null, frame = 0, last = 0, visible = false;

const EXPLAIN = {
  bed: "热床（Y 轴）：同步带 + 线轨驱动，最高 80 ℃，4 弹簧 + 4 螺丝调平",
  gantry: "X 横梁：工具头左右行程 180 mm，最高 500 mm/s、加速度 10000 mm/s²",
  toolhead: "工具头：0.4 mm 喷嘴最高 300 ℃，全金属热端，闭环部件冷却风扇",
  spool: "料盘支架：立柱顶端，耗材 1.75 mm，经 PTFE 管送料",
  tube: "PTFE 管：耗材通道，从料盘接到工具头进料口，随工具头移动",
  print: "正在打印的花瓶：工具头走左右、热床走前后，合起来画一个圆，走完一圈升一层",
};

const hintEl = document.querySelector('[data-corner="hint"]');
const HINT0 = hintEl.textContent;
function report(text) { if (readout.textContent !== text) readout.textContent = text; }
function say(text) { if (hintEl.textContent !== text) hintEl.textContent = text; }

function draw() {
  const t = layer / (LAYERS - 1);
  const r = printR(t);
  PRINT.forEach((node, index) => { node.style.display = index <= layer ? "" : "none"; });
  const lift = GANTRY_REST + layer * LAYER_H + apart * 120;
  bedG.setAttribute("transform", translateAlong(P, [0, dy, 0]));
  gantryG.setAttribute("transform", translateAlong(P, [0, 0, lift]));
  toolG.setAttribute("transform", translateAlong(P, [x, 0, lift]));
  const top = lift + TOOL_TOP;
  const pts = smooth3([
    [x, BEAM_Y + 22, top],
    [x - 3, BEAM_Y + 26, top + 52],
    [x + 30, 34, top + 120],
    [96, -6, 344],
    [130, -18 - 20, 350],
  ]).map((point) => iso(point, P));
  const d = polyPath(pts);
  const ribbon = ribbonD(pts);
  tubePaths.forEach((node) => node.setAttribute("d", ribbon));
  tubeHi.setAttribute("d", d);
  report("第 " + (layer + 1) + "/" + LAYERS + " 层 · Z " + (PLATE_TOP + layer * LAYER_H).toFixed(1) +
    " mm · X " + x.toFixed(0) + " Y " + (-dy).toFixed(0));
  say(hover ? (EXPLAIN[hover] || hover) : HINT0);
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  apart += (explode - apart) * (calm ? 1 : 0.09);
  if (!paused && !hover) {
    const t = layer / (LAYERS - 1);
    const r = printR(t);
    theta += dt * (0.85 + (1 - t) * 0.7) * (calm ? 0 : 1);
    while (theta >= Math.PI * 2) {
      theta -= Math.PI * 2;
      layer += 1;
      if (layer >= LAYERS) { layer = 0; }
    }
    x = r * Math.cos(theta);
    dy = -r * Math.sin(theta);
  }
  draw();
  frame = visible ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);

svg.addEventListener("pointermove", (event) => {
  const node = event.target.closest("[data-explain]");
  const part = node ? node.getAttribute("data-explain") : (event.target.closest('[data-part="print"]') ? "print" : null);
  if (part !== hover) { hover = part; draw(); }
});
svg.addEventListener("pointerleave", () => { if (hover) { hover = null; draw(); } });
stage.addEventListener("keydown", (event) => {
  if (event.key === " ") { paused = !paused; event.preventDefault(); draw(); }
  else if (event.key === "e" || event.key === "E") { explode = explode ? 0 : 1; run(); }
  else if (event.key === "Escape") { explode = 0; hover = null; draw(); }
});
if (still.matches) paused = true;
draw();
run();
</script></body></html>
