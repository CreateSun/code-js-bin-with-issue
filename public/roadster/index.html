.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}

.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}

.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}

[data-mat] .tb-body{fill:var(--mat-body)}
[data-mat] .tb-shine{fill:var(--mat-shine)}
[data-mat] .tb-shade{fill:var(--mat-shade)}
[data-mat] .tb-edge{stroke:var(--mat-edge)}
.tb[data-hue="red"]{--tb-ink:var(--anatomy-red)}
.tb[data-hue="green"]{--tb-ink:var(--anatomy-green)}
.tb[data-hue="blue"]{--tb-ink:var(--anatomy-blue)}
.tb[data-hue] .tb-body{fill:color-mix(in srgb,var(--tb-ink) 54%,var(--anatomy-shade-2))}
.tb[data-hue] .tb-shine{fill:color-mix(in srgb,var(--tb-ink) 16%,var(--anatomy-top))}
.tb[data-hue] .tb-shade{fill:color-mix(in srgb,var(--tb-ink) 30%,var(--anatomy-hi))}
.tb[data-hue] .tb-edge{stroke:color-mix(in srgb,var(--tb-ink) 38%,var(--anatomy-hi))}
.tb[data-hue][data-mat] .tb-body{fill:color-mix(in srgb,var(--tb-ink) 62%,var(--mat-body))}
.tb[data-hue][data-mat] .tb-shine{fill:color-mix(in srgb,var(--tb-ink) 22%,var(--mat-shine))}

.iso-turn{position:relative}
.iso-turn>.iso-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* Roadster 场景的标记样式：深色是夜间试验场，浅色是白纸工程图。 */
.rd-stage {
  --rd-ink: rgba(255, 255, 255, 0.42);
  --rd-ink-soft: rgba(255, 255, 255, 0.22);
  --rd-num: rgba(255, 255, 255, 0.78);
  --rd-pool: #78a8e8;
  --rd-red: #ff3b30;
  --rd-glass: rgba(20, 28, 38, 0.92);
  --rd-warm: #ffe9c4;
  --rd-body-0: #c3cbd6;
  --rd-body-1: #d8dee7;
  --rd-body-2: #e8edf3;
  --rd-body-3: #f5f7fa;
  --rd-body-top: #ffffff;
}
body[data-theme="light"] .rd-stage {
  --rd-body-0: #3a4048;
  --rd-body-1: #2e343b;
  --rd-body-2: #22272d;
  --rd-body-3: #16191d;
  --rd-body-top: #0b0d10;
  --rd-ink: rgba(15, 23, 42, 0.34);
  --rd-ink-soft: rgba(15, 23, 42, 0.16);
  --rd-num: rgba(15, 23, 42, 0.72);
  --rd-pool: #7f9ac4;
  --rd-red: #d21f16;
  --rd-glass: rgba(46, 58, 74, 0.88);
  --rd-warm: #c98a20;
}
.rd-lane {
  fill: none;
  stroke: var(--rd-ink);
  stroke-width: 5;
  stroke-linecap: round;
}
.rd-rule {
  fill: none;
  stroke: var(--rd-ink);
  stroke-width: 3.4;
}
.rd-num {
  fill: var(--rd-num);
  font: 600 34px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
}
.rd-label {
  fill: var(--rd-num);
  font: 600 27px/1 ui-sans-serif, system-ui, "PingFang SC", sans-serif;
}
.rd-unit {
  fill: var(--rd-ink);
  font: 600 24px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
}
.rd-led {
  fill: var(--rd-red);
}
.rd-ramp-led path {
  fill: none;
  stroke: var(--rd-red);
  stroke-width: 5;
  stroke-linecap: round;
}
.rd-ramp-led circle {
  fill: var(--rd-red);
}
.rd-pool-core {
  stop-color: var(--rd-pool);
  stop-opacity: 0.95;
}
.rd-pool-edge {
  stop-color: var(--rd-pool);
  stop-opacity: 0;
}
.rd-glass {
  fill: var(--rd-glass);
}
.rd-seam {
  fill: none;
  stroke: var(--rd-ink-soft);
  stroke-width: 2.6;
}
.rd-taillight rect {
  fill: var(--rd-red);
}
.rd-headlight rect {
  fill: var(--rd-warm);
}
.rd-panel {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 14px 0 0;
  font: 13px/1.6 ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif;
}
.rd-hud {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 22px;
  padding: 10px 14px;
  border: 1px solid rgba(128, 128, 128, 0.3);
  border-radius: 4px;
}
.rd-hud span {
  font-size: 11px;
  line-height: 1.5;
  letter-spacing: 0.08em;
  color: var(--muted, #888);
  text-transform: uppercase;
}
.rd-hud b {
  display: block;
  font: 600 19px/1.25 ui-monospace, SFMono-Regular, Menlo, monospace;
  color: inherit;
  letter-spacing: 0;
}
.rd-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.rd-row .rd-clock {
  min-width: 80px;
  font: 600 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
  text-align: right;
}
.rd-row input[type="range"] {
  flex: 1 1 240px;
  min-width: 160px;
}
.rd-phase {
  padding: 4px 11px;
  font-size: 12px;
  color: inherit;
  background: none;
  border: 1px solid rgba(128, 128, 128, 0.4);
  border-radius: 999px;
  cursor: pointer;
}
.rd-phase:hover {
  border-color: var(--link);
  color: var(--link);
}
.rd-phase[aria-current="true"] {
  border-color: var(--link);
  color: var(--link);
}

/* 车身：视频里的车是白的，深色主题下把它提亮成受光的主体；浅色主题用近黑墨色。 */
.rd-stage [data-name^="car."][data-lit] {
  --tn-0: var(--rd-body-0);
  --tn-1: var(--rd-body-1);
  --tn-2: var(--rd-body-2);
  --tn-3: var(--rd-body-3);
  --tn-4: var(--rd-body-top);
}

/* 尾焰与扬尘：强度由运动模型的推力档位/扬尘量通过 CSS 变量驱动 */
.rd-plume {
  opacity: var(--rd-thrust, 0);
  transition: opacity 90ms linear;
}
.rd-dust {
  opacity: calc(var(--rd-dust, 0) * 0.95);
  transition: opacity 200ms linear;
}

</div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>被推进器推着走的车身：唯一受光的部件</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>坡道、地面、路侧仪表：与车同处一个活层，逐帧重投影</span></span><span class="iso-caption">依据 X 上流传的「Tesla Live」风格视频做的 CG 复刻，不是官方影像：四分之一管坡道爬升 → 冷气推进器点火脱出 → 后空翻（轮子朝天）→ 自由落体 → 下喷制动 → 触地扬尘 → 前驶数米停住。所有读数与指针都由同一个运动模型算出。</span></figcaption></figure></main><script type="module">const T3_ROOT = Math.sqrt(1.6);
const T3_TAU = Math.PI * 2;
const T3_RAD = Math.PI / 180;
const T3_LB = [0, 0.2, 0.42, 0.62];
const T3_EB = [0.25, 0.5, 0.75];
const T3_SOFT = 0.035;
const T3_LEVELS = 32;
const T3_Q = 64;
const t3State = { detail: 1, exact: false };

function t3Num(v) {
  if (t3State.exact) return String(Math.round(v * 1e6) / 1e6);
  let t = Math.round(v * 100);
  if (t === 0) return "0";
  let sign = "";
  if (t < 0) {
    sign = "-";
    t = -t;
  }
  const whole = Math.floor(t / 100);
  const part = t - whole * 100;
  if (part === 0) return sign + whole;
  if (part < 10) return sign + whole + ".0" + part;
  return sign + whole + "." + (part % 10 === 0 ? part / 10 : part);
}

function t3Fix(v, scale) {
  const t = Math.round(v * scale) / scale;
  return t === 0 ? "0" : String(t);
}

function t3Path(buf, count, closed) {
  if (count < 2) return "";
  let s = "M" + t3Num(buf[0]) + " " + t3Num(buf[1]);
  for (let i = 1; i < count; i++) s += "L" + t3Num(buf[2 * i]) + " " + t3Num(buf[2 * i + 1]);
  return closed ? s + "Z" : s;
}

const t3Step = (a, b, x) => {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};

function t3Level(score, bands) {
  let u = 0;
  for (let i = 0; i < bands.length; i++) u += t3Step(bands[i] - T3_SOFT, bands[i] + T3_SOFT, score);
  return Math.round(u * T3_Q);
}

function t3Grow(f, name, size, Kind) {
  if (!f[name] || f[name].length < size) f[name] = new Kind(Math.max(size, f[name] ? f[name].length * 2 : 16));
  return f[name];
}

function t3Box(buf, count, box) {
  let x0 = Infinity;
  let y0 = Infinity;
  let x1 = -Infinity;
  let y1 = -Infinity;
  for (let i = 0; i < count; i++) {
    const x = buf[2 * i];
    const y = buf[2 * i + 1];
    if (x < x0) x0 = x;
    if (x > x1) x1 = x;
    if (y < y0) y0 = y;
    if (y > y1) y1 = y;
  }
  box[0] = x0;
  box[1] = y0;
  box[2] = x1;
  box[3] = y1;
}

function t3Unit(v) {
  const l = Math.hypot(v[0], v[1], v[2]) || 1;
  return [v[0] / l, v[1] / l, v[2] / l];
}

function t3Rot(axis, degrees) {
  const [x, y, z] = t3Unit(axis);
  const c = Math.cos(degrees * T3_RAD);
  const s = Math.sin(degrees * T3_RAD);
  const C = 1 - c;
  return new Float64Array([c + x * x * C, x * y * C - z * s, x * z * C + y * s, y * x * C + z * s, c + y * y * C, y * z * C - x * s, z * x * C - y * s, z * y * C + x * s, c + z * z * C]);
}

function t3Mul(A, B) {
  const out = new Float64Array(9);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) out[r * 3 + c] = A[r * 3] * B[c] + A[r * 3 + 1] * B[3 + c] + A[r * 3 + 2] * B[6 + c];

const t3Apply = (R, v) => [R[0] * v[0] + R[1] * v[1] + R[2] * v[2], R[3] * v[0] + R[4] * v[1] + R[5] * v[2], R[6] * v[0] + R[7] * v[1] + R[8] * v[2]];

const T3_EYE = new Float64Array([1, 0, 0, 0, 1, 0, 0, 0, 1]);

function t3Camera(P, pose) {
  const a = (P.azimuth ?? 45) * T3_RAD;
  const e = (P.elevation ?? 30) * T3_RAD;
  const k = P.scale * T3_ROOT;
  const sa = Math.sin(a);
  const ca = Math.cos(a);
  const se = Math.sin(e);
  const ce = Math.cos(e);
  const cam = { m: new Float64Array(6), ox: 0, oy: 0, V: [0, 0, 0], L: [0, 0, 0], k, turn: 0, R: T3_EYE, t: [0, 0, 0], lx: 0, ly: 1, sa, ca, se, ce, origin: P.origin };
  const lw = Math.hypot(sa, ca, 1.2);
  if (pose && pose.R && !(pose.turn !== undefined && pose.root)) {

    const t = pose.t ?? [0, 0, 0];

    const r1 = [ca * se * k, sa * se * k, -ce * k];
