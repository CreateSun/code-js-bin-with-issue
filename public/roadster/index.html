function t3Enclose(points, edges) {
  const hull = t3Hull(points);
  const n = hull.length;
  if (n < 3) return [];
  let area = 0;
  for (let i = 0; i < n; i++) area += hull[i][0] * hull[(i + 1) % n][1] - hull[(i + 1) % n][0] * hull[i][1];
  const sign = area >= 0 ? 1 : -1;
  let lines = [];
  for (let i = 0; i < n; i++) {
    const p = hull[i];
    const q = hull[(i + 1) % n];
    const dx = q[0] - p[0];
    const dy = q[1] - p[1];
    const l = Math.hypot(dx, dy);
    if (l < 1e-9) continue;
    const nx = (sign * dy) / l;
    const ny = (-sign * dx) / l;
    lines.push([nx, ny, -(nx * p[0] + ny * p[1])]);
  }
  const meet = (A, B) => {
    const det = A[0] * B[1] - A[1] * B[0];
    if (Math.abs(det) < 1e-12) return null;
    return [(-A[2] * B[1] + B[2] * A[1]) / det, (-A[0] * B[2] + B[0] * A[2]) / det];
  };
  while (lines.length > edges) {
    let best = -1;
    let cost = Infinity;
    const m = lines.length;
    for (let i = 0; i < m; i++) {
      const prev = lines[(i - 1 + m) % m];
      const self = lines[i];
      const next = lines[(i + 1) % m];
      const turn = prev[0] * next[1] - prev[1] * next[0];
      if (sign * turn <= 1e-9) continue;
      const apex = meet(prev, next);
      const a = meet(prev, self);
      const b = meet(self, next);
      if (!apex || !a || !b) continue;
      const added = Math.abs((a[0] - apex[0]) * (b[1] - apex[1]) - (a[1] - apex[1]) * (b[0] - apex[0])) / 2;
      if (added < cost) {
        cost = added;
        best = i;
      }
    }
    if (best < 0) break;
    lines.splice(best, 1);
  }
  return lines;
}

function t3Cover(controller, names, { polygons = 6, edges = 10, pad = 0.3, layers = null } = {}) {
  const uCoverEdge = new Float32Array(polygons * edges * 3);
  const uCoverCount = new Float32Array(polygons);
  const scene = controller.scene();
  const frames = controller.frames();
  const sets = Array.isArray(names) ? (names.length && Array.isArray(names[0]) ? names : [names]) : [[names]];
  const candidates = [];
  const taken = new Set();
  for (const list of sets) {
    const targets = scene.runs.filter((run) => list.includes(run.name));
    if (!targets.length) continue;
    const box = [Infinity, Infinity, -Infinity, -Infinity];
    for (const run of targets) {
      const b = frames[run.index].box;
      box[0] = Math.min(box[0], b[0]);
      box[1] = Math.min(box[1], b[1]);
      box[2] = Math.max(box[2], b[2]);
      box[3] = Math.max(box[3], b[3]);
    }
    const home = targets[0].layer;
    scene.layers.forEach((layer, index) => {
      const order = controller.orderIndex(layer.name);
      if (!order) return;
      let from = 0;
      if (index === home) {
        for (let at = 0; at < order.length; at++) if (targets.some((run) => run.index === order[at])) from = at + 1;
      } else if (!(layers && layers.includes(layer.name)) || index < home) return;
      for (let at = from; at < order.length; at++) {
        const run = scene.runs[order[at]];
        if (list.includes(run.name) || taken.has(run.index)) continue;
        const f = frames[run.index];
        const b = f.box;
        if (!(b[0] < box[2] + pad && box[0] < b[2] + pad && b[1] < box[3] + pad && box[1] < b[3] + pad)) continue;
        if (!targets.some((target) => !t3Disjoint(frames[target.index], f, -pad))) continue;
        taken.add(run.index);
        const share = (Math.min(b[2], box[2]) - Math.max(b[0], box[0])) * (Math.min(b[3], box[3]) - Math.max(b[1], box[1]));
        candidates.push({ run, f, share });
      }
    });
  }
  candidates.sort((a, b) => b.share - a.share);
  const parts = [];
  let slot = 0;
  for (const { run, f } of candidates) {
    if (slot >= polygons) break;
    const points = [];
    if (f.quadN) for (const [buf, count] of f.quadList) for (let i = 0; i < count; i++) points.push([buf[2 * i], buf[2 * i + 1]]);

    lines.forEach((line, e) => {
      const at = (slot * edges + e) * 3;
      uCoverEdge[at] = line[0];

      uCoverEdge[at + 2] = line[2] - pad;

    parts.push(run.name);
    slot++;

function t3PoseOf(scene, cams, name) {
  const index = scene.groups.findIndex((g) => g.name === name);
  const cam = index >= 0 && cams ? cams[index] : null;
  return { R: cam ? Array.from(cam.R) : Array.from(T3_EYE), t: cam ? [cam.t[0], cam.t[1], cam.t[2]] : [0, 0, 0] };
}

function t3Anchor(scene, cams, name, point, direction) {
  const index = name === null || name === undefined ? -1 : scene.groups.findIndex((g) => g.name === name);
  const cam = index >= 0 ? cams[index] : cams.world;
  const o = index >= 0 ? scene.groups[index].origin : [0, 0, 0];
  const R = cam.R;
  const q = [point[0] - o[0], point[1] - o[1], point[2] - o[2]];
  const world = [R[0] * q[0] + R[1] * q[1] + R[2] * q[2] + cam.t[0], R[3] * q[0] + R[4] * q[1] + R[5] * q[2] + cam.t[1], R[6] * q[0] + R[7] * q[1] + R[8] * q[2] + cam.t[2]];
  const w = cams.world;
  const screen = [w.ox + w.m[0] * world[0] + w.m[1] * world[1] + w.m[2] * world[2], w.oy + w.m[3] * world[0] + w.m[4] * world[1] + w.m[5] * world[2]];
  const out = { world, screen };
  if (direction) out.direction = [R[0] * direction[0] + R[1] * direction[1] + R[2] * direction[2], R[3] * direction[0] + R[4] * direction[1] + R[5] * direction[2], R[6] * direction[0] + R[7] * direction[1] + R[8] * direction[2]];
  return out;
}

function t3FloorOf(scene, name, R = T3_EYE) {
  const index = scene.groups.findIndex((g) => g.name === name);
  let low = Infinity;
  for (const run of scene.runs) {
    if (run.group !== index) continue;
    const c = run.cloud;
    for (let i = 0; i < c.length; i += 3) {
      const z = R[6] * c[i] + R[7] * c[i + 1] + R[8] * c[i + 2];
      if (z < low) low = z;
    }
  }
  return low;
}

function t3Compose(A, B) {
  return Array.from(t3Mul(A, B));
}

function t3PoseUniforms(controller, group, prefix = "uGroup") {
  const scene = controller.scene();
  const index = scene.groups.findIndex((g) => g.name === group);
  const cams = controller.cams();
  const cam = index >= 0 && cams ? cams[index] : null;
  const R = cam ? cam.R : T3_EYE;
  const t = cam ? cam.t : [0, 0, 0];
  const o = index >= 0 ? scene.groups[index].origin : [0, 0, 0];
  const T = [t[0] - (R[0] * o[0] + R[1] * o[1] + R[2] * o[2]), t[1] - (R[3] * o[0] + R[4] * o[1] + R[5] * o[2]), t[2] - (R[6] * o[0] + R[7] * o[1] + R[8] * o[2])];
  return { [`${prefix}X`]: [R[0], R[3], R[6]], [`${prefix}Y`]: [R[1], R[4], R[7]], [`${prefix}Z`]: [R[2], R[5], R[8]], [`${prefix}T`]: T };
}

// Roadster 起飞动作的运动模型：相位、轨迹、姿态与读数全部从这里来。
// 单位：1 单位 = 1 cm；时间 s；角度 rad（对外读数用度）。
// 页面与构建脚本共用这一份代码（原样内联到页面里）。
//
// 物理口径：G 读数是加速度计口径（静止 1 g、自由落体 0、推力段按推力倍数），
// 与视频里的 G-FORCE 表一致；高度取车轮接地点到车身原点的真实高度。

const G0 = 980; // cm/s^2
const WHEEL_R = 35; // 车轮半径：静止时车身原点离地高度
const RAMP_R = 900; // 四分之一管半径
const RAMP_C = [0, 900]; // 坡面圆心（x, z）
const A_TOP = (78 * Math.PI) / 180; // 离开坡面时的俯仰角
const T_HOLD = 1.6; // 坡底待机
const T_TOP = 5.2; // 离开坡面
const T_BURN1 = 0.7; // 起跳推力时长
const BURN_G = 1.6; // 起跳推力（重力倍数，与视频 HUD 的爬升段量级一致）
const ARREST_G = 2.1; // 下喷制动推力（重力倍数，与视频 HUD 落地段一致）
const STOP_DECEL = 320; // 触地后减速度 cm/s^2
const ROLL_V = 700; // 触地后的初速 cm/s
const FLIP = ((360 - 78) * Math.PI) / 180; // 后空翻角度（78° → 360°）

const DT = 1 / 240;
const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const ease01 = (x) => {

/** 坡面几何：参数 a 处的接触点、切向、法向。 */
function rampAt(a) {
  const s = Math.sin(a);
  const c = Math.cos(a);
  return {
    contact: [RAMP_C[0] + RAMP_R * s, 0, RAMP_C[1] - RAMP_R * c],
    tangent: [c, 0, s],
    normal: [-s, 0, c],
  };
}

/** 车轮接地点 → 车身原点（原点始终在坡面法向一个轮径之上）。 */
function originAt(a) {
  const at = rampAt(a);
  return [at.contact[0] + at.normal[0] * WHEEL_R, 0, at.contact[2] + at.normal[2] * WHEEL_R];

/** 爬升阶段的俯仰角：从 0 缓入到 A_TOP（终点角速度最大，正好脱出）。 */
function climbAngle(t) {
  const u = clamp01((t - T_HOLD) / (T_TOP - T_HOLD));

function integrate() {

  const arcSpeed = (2 * A_TOP * RAMP_R) / (T_TOP - T_HOLD); // 脱离坡面瞬间的弧面速度

  const start = originAt(A_TOP);
  let p = start.slice();
  let v = [tangent[0] * arcSpeed, 0, tangent[2] * arcSpeed];
  let t = T_TOP;
  let landing = null;
  // 制动开始高度：从最高点 A 自由落体再以 ARREST_G 减速，理论上在 A / ARREST_G 处速度归零。
  let arrestAt = Infinity;
  const push = (thrust, g) => frames.push({ t, p: p.slice(), v: v.slice(), thrust, g });

  while (t < T_TOP + 14 && !landing) {
    const burning = t < T_TOP + T_BURN1;
    if (!burning && v[2] <= 0 && arrestAt === Infinity) arrestAt = p[2] / ARREST_G;
    const arresting = v[2] < 0 && p[2] <= arrestAt;
    const g = burning ? BURN_G : arresting ? ARREST_G : 0;
    const thrust = burning ? 1 : arresting ? 2 : 0;

    p[0] += v[0] * DT;
    p[2] += v[2] * DT;
    t += DT;

      p[2] = WHEEL_R;
      landing = { t, x: p[0], vz: v[2] };
      push(thrust, g);
      break;
    }
    push(thrust, g);
  }

const SOLVED = integrate();

      phase: 1,

      pitch: a,
      thrust: 0,

      p: f.p.slice(),
      v: f.v.slice(),
      acc: [0, 0, f.g * G0],
      pitch: A_TOP + FLIP * flipU,
      thrust: f.thrust,
      dust: f.thrust === 2 ? Math.max(0, 1 - f.p[2] / 600) : 0,

let playing = !still.matches;
let frame = 0;
let last = 0;
let visible = false;

const controller = TURN.mount(stage, DATA.turn, {
  onHold: () => setPlaying(false),
});

// 相位起始时刻：从模型采样得到，不写死
const PHASE_AT = (() => {
  const first = {};
  for (let t = 0; t <= END + 1e-9; t += 0.02) {
    const p = readingAt(t).phase;
    if (first[p] === undefined) first[p] = t;
  }
  return first;
})();

function setPlaying(on) {
  playing = on;
  if (playBtn) {
    playBtn.textContent = on ? "暂停" : "播放";
    playBtn.setAttribute("aria-pressed", String(on));
  }
  run();
}

function show(t, r) {
  hud.alt.textContent = r.alt.toFixed(1);
  hud.g.textContent = r.g.toFixed(2);
  hud.spd.textContent = r.speed.toFixed(1);
  hud.pitch.textContent = Math.round(r.pitch);
  hud.dist.textContent = r.distance.toFixed(1);
  hud.phase.textContent = DATA.phases[r.phase];
  if (clockEl) clockEl.textContent = t.toFixed(2) + " s";
  if (readout) {
    const text = `高度 ${r.alt.toFixed(1)} m · ${DATA.phases[r.phase]}`;
    if (readout.textContent !== text) readout.textContent = text;
  }
  if (scrub && document.activeElement !== scrub) scrub.value = String(Math.round((t / END) * 1000));
  for (const button of phaseRow.children) button.setAttribute("aria-current", String(Number(button.dataset.phase) === r.phase));
}

// 尾焰与扬尘的强度：由模型的推力档位与扬尘量写成 CSS 变量
function paint(r) {
  stage.style.setProperty("--rd-thrust", r.thrust === 1 ? "1" : r.thrust === 2 ? "0.92" : "0");
  stage.style.setProperty("--rd-dust", String(Math.max(0, Math.min(1, r.dust))));
}

function draw() {
  controller.set(valuesAt(time));
  const r = readingAt(time);
  show(time, r);
  paint(r);
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60;
  last = now;
  if (playing) time += dt;
  if (time >= END) time -= END;
  draw();
  frame = visible && playing ? requestAnimationFrame(tick) : 0;
}

function run() {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
  else if (frame) {
    cancelAnimationFrame(frame);
    frame = 0;
  }
}, { rootMargin: "140px 0px" }).observe(stage);

if (scrub) {
  scrub.addEventListener("input", () => {
    setPlaying(false);
    time = (Number(scrub.value) / 1000) * END;
    draw();
  });
}
if (playBtn) playBtn.addEventListener("click", () => setPlaying(!playing));
if (phaseRow) {
  DATA.phases.forEach((name, index) => {
    if (PHASE_AT[index] === undefined) return;
    const button = document.createElement("button");
    button.type = "button";
    button.className = "rd-phase";
    button.dataset.phase = String(index);
    button.textContent = name;
    button.addEventListener("click", () => {
      setPlaying(false);
      time = PHASE_AT[index];
      draw();
    });
    phaseRow.appendChild(button);
  });
}
if (factsEl) {
  const f = DATA.facts;
  factsEl.innerHTML = [
    ["坡道半径", `${f.rampR.toFixed(1)} m`],
    ["脱出速度", `${f.climb.toFixed(1)} m/s`],
    ["起跳推力", `${f.burn.toFixed(2)} g`],
    ["峰值高度", `${f.apogee.toFixed(1)} m`],
    ["下喷制动", `${f.arrest.toFixed(2)} g`],
    ["触地垂直速度", `${Math.abs(f.impact).toFixed(1)} m/s`],
    ["触地后前驶", `${f.roll.toFixed(1)} m`],
    ["单次循环", `${END.toFixed(1)} s`],
  ]
    .map(([key, value]) => `<span>${key}<b>${value}</b></span>`)
    .join("");
}
stage.addEventListener("keydown", (event) => {
  const step = event.shiftKey ? 1 : 0.1;
  if (event.key === " ") {
    event.preventDefault();
    setPlaying(!playing);
  } else if (event.key === "ArrowRight") {
    event.preventDefault();
    setPlaying(false);
    time = Math.min(END, time + step);
    draw();
  } else if (event.key === "ArrowLeft") {
    event.preventDefault();
    setPlaying(false);
    time = Math.max(0, time - step);
    draw();
  } else if (event.key === "r" || event.key === "R") {
    event.preventDefault();
    time = 0;
    setPlaying(true);
  }
});
dark.addEventListener("change", syncTheme);
syncTheme();
if (still.matches) setPlaying(false);
draw();
</script></body></html>
