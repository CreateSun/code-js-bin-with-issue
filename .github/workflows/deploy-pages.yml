name: Deploy Pages

on:
  push:
    branches: [main]
  # issue 就是内容源：任何增删改都重新编译并发布
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build site from issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 项目站点部署在 /<repo>/ 下，交给构建脚本拼绝对路径
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # 只发布仓库 owner 的 issue；想让协作方也能发布就删掉这一行
          ISSUE_AUTHOR: ${{ github.repository_owner }}
        run: node scripts/build.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
